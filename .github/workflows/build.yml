name: Build Cubiomes (1.21.11)

on:
  push:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static library
        run: make release

      - name: Build CLI
        run: cc -O2 -o mcseedcli mcseedcli.c -L. -lcubiomes -lm

      - name: Smoke test (1.21.11)
        run: |
          ./mcseedcli stronghold 12 1.21.11 | head -6
          ./mcseedcli village 12 -49869 -13702 2000 1.21.11 | head -6

      - name: Package
        run: |
          mkdir -p dist/include dist/lib dist/bin
          cp *.h dist/include/
          cp libcubiomes.a dist/lib/
          cp mcseedcli dist/bin/
          cd dist && zip -r ../cubiomes-1.21.11-linux.zip . && cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cubiomes-1.21.11-linux
          path: cubiomes-1.21.11-linux.zip

  windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build Windows static lib, DLL and CLI
        run: |
          x86_64-w64-mingw32-gcc -O3 -fwrapv -D_WIN32 -c noise.c biomes.c layers.c biomenoise.c generator.c finders.c util.c quadbase.c
          x86_64-w64-mingw32-ar cr libcubiomes.a *.o
          x86_64-w64-mingw32-gcc -O3 -shared -o cubiomes.dll *.o -Wl,--export-all-symbols -lm
          x86_64-w64-mingw32-gcc -O2 -D_WIN32 -o mcseedcli.exe mcseedcli.c -L. -lcubiomes -lm

      - name: Package
        run: |
          mkdir -p dist/include dist/lib dist/bin
          cp *.h dist/include/
          cp libcubiomes.a dist/lib/
          cp cubiomes.dll dist/bin/
          cp mcseedcli.exe dist/bin/
          cd dist && zip -r ../cubiomes-1.21.11-windows.zip . && cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cubiomes-1.21.11-windows
          path: cubiomes-1.21.11-windows.zip
